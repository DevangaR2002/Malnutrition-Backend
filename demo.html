<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malnutrition Risk Predictor - Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            background: white;
            display: none;
        }
        .high-risk {
            background-color: #ffcccc;
            border-color: red;
        }
        .low-risk {
            background-color: #ccffcc;
            border-color: green;
        }
        .recommendation {
            margin: 10px 0;
            padding: 10px;
            background: #f9f9f9;
            border-left: 3px solid #007bff;
        }
        .error {
            background-color: #ffcccc;
            color: red;
        }
    </style>
</head>
<body>
    <h1>🍼 Child Malnutrition Risk Predictor</h1>
    <p style="text-align: center;">Demo Version - Sri Lanka</p>
    
    <form id="predictionForm">
        <label>Age (months):</label>
        <input type="number" id="age_months" min="0" max="60" value="24" required>
        
        <label>Gender:</label>
        <select id="gender" required>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        
        <label>Mother's Education:</label>
        <select id="mother_education" required>
            <option value="No education">No education</option>
            <option value="Primary">Primary</option>
            <option value="Secondary">Secondary</option>
            <option value="Higher">Higher</option>
        </select>
        
        <label>Household Wealth:</label>
        <select id="household_wealth_index" required>
            <option value="Low">Low</option>
            <option value="Middle">Middle</option>
            <option value="High">High</option>
        </select>
        
        <label>Height (cm):</label>
        <input type="number" id="height_cm" min="30" max="150" step="0.1" value="85" required>
        
        <label>Weight (kg):</label>
        <input type="number" id="weight_kg" min="1" max="40" step="0.1" value="10" required>
        
        <label>Health Conditions:</label>
        <div style="margin-top: 5px;">
            <input type="checkbox" id="has_diarrhea"> Diarrhea
            <input type="checkbox" id="has_malaria"> Malaria
            <input type="checkbox" id="has_tb"> TB
        </div>
        
        <button type="submit">Predict Risk</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        const API_URL = 'http://localhost:8000';
        
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const data = {
                age_months: parseInt(document.getElementById('age_months').value),
                gender: document.getElementById('gender').value,
                mother_education: document.getElementById('mother_education').value,
                household_wealth_index: document.getElementById('household_wealth_index').value,
                height_cm: parseFloat(document.getElementById('height_cm').value),
                weight_kg: parseFloat(document.getElementById('weight_kg').value),
                has_diarrhea: document.getElementById('has_diarrhea').checked,
                has_malaria: document.getElementById('has_malaria').checked,
                has_tb: document.getElementById('has_tb').checked
            };
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = '';
            resultDiv.innerHTML = 'Loading...';
            
            try {
                const response = await fetch(`${API_URL}/api/predictions/predict`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    resultDiv.className = result.risk_level === 'High Risk' ? 'high-risk' : 'low-risk';
                    
                    let html = `
                        <h2>${result.risk_level === 'High Risk' ? '⚠️' : '✅'} ${result.risk_level}</h2>
                        <p><strong>Probability:</strong> ${(result.risk_probability * 100).toFixed(1)}%</p>
                        <p><strong>Confidence:</strong> ${result.confidence}</p>
                        <h3>Recommendations:</h3>
                    `;
                    
                    result.recommendations.forEach(rec => {
                        html += `
                            <div class="recommendation">
                                <strong>${rec.category}</strong><br>
                                ${rec.recommendation}<br>
                                <small><em>Source: ${rec.source}</em></small>
                            </div>
                        `;
                    });
                    
                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerHTML = `<strong>Error:</strong> ${result.detail || 'Unknown error'}`;
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.innerHTML = `<strong>Error:</strong> ${error.message}. Make sure the API is running.`;
            }
        });
    </script>
</body>
</html>
